name: Doc Pipeline

# Dipicu oleh backend KMS setelah dokumen tersimpan di staging.
# Saat ini hanya memeriksa kode dan mencatat version. Belum ada gerbang
# Gate 1 atau Gate 2, dan tidak ada promosi otomatis.
on:
  repository_dispatch:
    types: [document-uploaded]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest src/lib/ai

      - name: Catat version dokumen
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: echo "doc-pipeline untuk version=$VERSION"
