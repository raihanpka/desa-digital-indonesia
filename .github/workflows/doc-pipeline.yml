name: Doc Pipeline

# Hanya berjalan untuk perubahan di bagian AI dan saat dokumen baru dipicu backend.
# Tidak memakai concurrency dan tidak diwajibkan (bukan required check), sehingga
# pekerjaan rekan di luar bagian AI tidak tertahan.
on:
  repository_dispatch:
    types: [document-uploaded]
  push:
    paths:
      - "src/lib/ai/**"
      - "src/app/api/admin/chatbot/**"
      - "src/scripts/promote-staging.ts"
      - ".github/workflows/doc-pipeline.yml"
  pull_request:
    paths:
      - "src/lib/ai/**"
      - "src/app/api/admin/chatbot/**"
      - "src/scripts/promote-staging.ts"
      - ".github/workflows/doc-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest src/lib/ai

      - name: Catat version dokumen
        if: github.event_name == 'repository_dispatch'
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: echo "doc-pipeline untuk version=$VERSION"
